<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200" fill="none">
  <defs>
    <linearGradient id="iconGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#7c3aed"/>
      <stop offset="100%" style="stop-color:#a855f7"/>
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#c4b5fd"/>
      <stop offset="50%" style="stop-color:#e9d5ff"/>
      <stop offset="100%" style="stop-color:#a855f7"/>
    </linearGradient>
    <linearGradient id="checkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#a855f7"/>
      <stop offset="100%" style="stop-color:#7c3aed"/>
    </linearGradient>
  </defs>
  
  <!-- Document Icon -->
  <g transform="translate(20, 10)">
    <!-- Document body -->
    <rect x="10" y="10" width="130" height="160" rx="16" fill="url(#iconGrad)" opacity="0.9"/>
    <!-- Page fold -->
    <path d="M110 10 L150 50 L110 50 Z" fill="#6d28d9" opacity="0.8"/>
    <path d="M110 10 L110 50 L150 50" fill="none" stroke="#8b5cf6" stroke-width="2"/>
    
    <!-- List lines -->
    <rect x="35" y="65" width="70" height="8" rx="4" fill="white" opacity="0.9"/>
    <rect x="35" y="85" width="55" height="8" rx="4" fill="white" opacity="0.7"/>
    <rect x="35" y="105" width="65" height="8" rx="4" fill="white" opacity="0.8"/>
    
    <!-- Checkmark -->
    <circle cx="75" cy="145" r="22" fill="url(#checkGrad)" opacity="0.95"/>
    <path d="M60 145 L70 155 L92 133" fill="none" stroke="white" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  
  <!-- Text "TMAly" -->
  <text x="200" y="135" font-family="Arial, Helvetica, sans-serif" font-size="120" font-weight="800" fill="url(#textGrad)" letter-spacing="-2">TMAly</text>
</svg>