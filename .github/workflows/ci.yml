name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run build
      - name: Verify bundled catalog fallback
        run: >-
          node -e "const fs=require('fs');
          const courses=JSON.parse(fs.readFileSync('dist/catalog/courses.json','utf8'));
          const branches=JSON.parse(fs.readFileSync('dist/catalog/branches.json','utf8'));
          const onsite=JSON.parse(fs.readFileSync('dist/catalog/onsite_courses.json','utf8'));
          const sourceCourses=JSON.parse(fs.readFileSync('../serverless/data/courses.json','utf8'));
          const sourceBranches=JSON.parse(fs.readFileSync('../serverless/data/branches.json','utf8'));
          if(!courses.length || courses.length!==sourceCourses.length) throw new Error('bundled courses not synchronized');
          if(!branches.length || branches.length!==sourceBranches.length) throw new Error('bundled branches not synchronized');
          if(Object.keys(onsite.courses||{}).length!==5) throw new Error('expected 5 configured onsite courses');"

  catalog-api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend-python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: backend-python/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: PYTHONPATH=. pytest -q
      - name: Verify branch and course metadata
        run: >-
          PYTHONPATH=. python -c "from app.main import BRANCHES, COURSES, BASE_COURSES; assert len(BRANCHES)==9; assert len(COURSES)==len(BASE_COURSES)>0; assert sum(1 for c in COURSES if c.get('onsite'))==5"

  serverless-api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Smoke test catalog, branches and durable-order guard
        run: |
          node --input-type=module <<'NODE'
          import { createServerlessOrder, listBranches, searchCourses } from './serverless/shared.mjs';
          const branches = listBranches();
          if (branches.count !== 9) throw new Error('expected 9 AOU branches');
          const catalog = searchCourses(new URL('https://example.test/api/courses'));
          const rawCourses = JSON.parse((await import('node:fs')).readFileSync('./serverless/data/courses.json','utf8'));
          if (catalog.count !== rawCourses.length || !catalog.count) throw new Error('catalog and API results out of sync');
          const body = { course_code: 'TM105', customer_name: 'Test User', contact: '000', branch: 'egypt', currency: 'EGP', service_type: 'TMA' };
          const withoutStorage = await createServerlessOrder(body, {});
          if (withoutStorage.status !== 503) throw new Error('orders must require a durable receiver');
          const withPassword = await createServerlessOrder({ ...body, lms_password: 'secret' }, {});
          if (withPassword.status !== 422) throw new Error('LMS credentials must be rejected');
          const oldFetch = globalThis.fetch;
          globalThis.fetch = async () => new Response('{}', { status: 200 });
          try {
            const accepted = await createServerlessOrder(body, { ORDER_WEBHOOK_URL: 'https://example.test/webhook' });
            if (accepted.status !== 201 || !accepted.body.forwarded) throw new Error('webhook forwarding failed');
          } finally {
            globalThis.fetch = oldFetch;
          }
          NODE
      - name: Smoke test country detection endpoint
        run: >-
          node -e "import('./api/location.mjs').then(async ({default:handler})=>{let statusCode=200,body=null;const req={method:'GET',headers:{'x-vercel-ip-country':'KW'}};const res={status(c){statusCode=c;return this},json(v){body=v;return this}};await handler(req,res);if(statusCode!==200||body?.countryCode!=='KW'||body?.supported!==true) process.exit(1);})"

  fx-service:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend-node
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --check src/index.js

  vercel-services:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate Vercel Services routing and bindings
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import assert from 'node:assert/strict';
          const config = JSON.parse(fs.readFileSync('vercel.json', 'utf8'));
          assert.deepEqual(Object.keys(config.services).sort(), ['backend-node', 'backend-python', 'frontend']);
          assert.equal(config.services['backend-node'].runtime, 'container');
          assert.equal(config.services['backend-node'].entrypoint, 'Dockerfile');
          assert.equal(config.services['backend-python'].entrypoint, 'app.main:app');
          assert.equal(config.services.frontend.framework, 'vite');
          assert.deepEqual(config.services['backend-python'].bindings, [
            { type: 'service', service: 'backend-node', format: 'url', env: 'FX_INTERNAL_URL' },
          ]);
          for (const k of ['functions', 'buildCommand', 'installCommand', 'devCommand', 'outputDirectory', 'framework']) {
            assert.ok(!(k in config), `${k} must live in a service, not at the top level`);
          }
          assert.deepEqual(config.rewrites, [
            { source: '/health', destination: { service: 'backend-python' } },
            { source: '/api', destination: { service: 'backend-python' } },
            { source: '/api/(.*)', destination: { service: 'backend-python' } },
            { source: '/(.*)', destination: { service: 'frontend' } },
          ]);
          assert.ok(!config.rewrites.some(x => x.destination.service === 'backend-node'),
            'FX container must remain internal');
          NODE
