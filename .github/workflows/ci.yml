name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run build
      - name: Verify bundled catalog fallback
        run: >-
          node -e "const fs=require('fs');
          const courses=JSON.parse(fs.readFileSync('dist/catalog/courses.json','utf8'));
          const branches=JSON.parse(fs.readFileSync('dist/catalog/branches.json','utf8'));
          if(courses.length!==217) throw new Error('expected 217 bundled courses');
          if(branches.length!==9) throw new Error('expected 9 AOU branches');"

  catalog-api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend-python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: backend-python/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: PYTHONPATH=. pytest -q
      - name: Verify branch metadata
        run: >-
          PYTHONPATH=. python -c "from app.main import BRANCHES, COURSES; assert len(BRANCHES)==9; assert len(COURSES)==217"

  serverless-api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Smoke test catalog, branches and payment rules
        run: |
          node --input-type=module <<'NODE'
          import { createServerlessOrder, publicBranches, searchCourses } from './serverless/shared.mjs';
          const branches = publicBranches();
          if (branches.count !== 9) throw new Error(`expected 9 branches, got ${branches.count}`);
          const search = searchCourses(new URL('https://example.test/api/courses?q=TM105&faculty=all'));
          if (search.count !== 1 || search.items[0]?.code !== 'TM105') throw new Error('TM105 catalog smoke failed');
          const badInternational = await createServerlessOrder({course_code:'TM105',customer_name:'Test User',contact:'000',branch_code:'KW',claim_type:'paid',currency:'KWD',payment_method:'usdt_trc20'});
          if (badInternational.status !== 422 || badInternational.body?.detail !== 'international_requires_usdt') throw new Error('international USDT rule failed');
          const goodInternational = await createServerlessOrder({course_code:'TM105',customer_name:'Test User',contact:'000',branch_code:'KW',claim_type:'paid',currency:'USDT',payment_method:'usdt_trc20',quoted_usdt_amount:1});
          if (goodInternational.status !== 201) throw new Error('international USDT order smoke failed');
          const freeNotOnsite = await createServerlessOrder({course_code:'TM105',customer_name:'Test User',contact:'000',branch_code:'EG',claim_type:'free_onsite',currency:'EGP'});
          if (freeNotOnsite.status !== 422 || freeNotOnsite.body?.detail !== 'course_is_not_onsite') throw new Error('onsite manifest gate failed');
          NODE
      - name: Smoke test country detection endpoint
        run: >-
          node -e "import('./api/location.mjs').then(async ({default:handler})=>{let statusCode=200,body=null;const req={method:'GET',headers:{'x-vercel-ip-country':'KW'}};const res={status(c){statusCode=c;return this},json(v){body=v;return this}};await handler(req,res);if(statusCode!==200||body?.countryCode!=='KW'||body?.supported!==true) process.exit(1);})"

  fx-service:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend-node
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --check src/index.js
